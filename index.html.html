<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manifiestos de transporte</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eaf0fa;--bgtop:#d4e1fa;--card:#fff;--ink:#1a2233;--mute:#5a6780;--line:#d5deee;--brand:#27368f;--brand-ink:#fff;--red:#d62828;--sky:#2f9be0;--thbg:#eef3fc;--hov:#f3f7ff;--ok:#1a8a52;--warn:#a86f00;--bad:#c62828;--okbg:#dff2e8;--warnbg:#fbeccb;--badbg:#f9dcd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--bgtop:#17214a;--card:#18213a;--ink:#e8edf8;--mute:#9aa8c6;--line:#2a3558;--brand:#8da0f5;--brand-ink:#0d1326;--thbg:#1f2a4a;--hov:#1d2849;--ok:#5cc491;--warn:#e3b04b;--bad:#f08577;--okbg:#18362a;--warnbg:#3a2f13;--badbg:#40201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1526;--bgtop:#17214a;--card:#18213a;--ink:#e8edf8;--mute:#9aa8c6;--line:#2a3558;--brand:#8da0f5;--brand-ink:#0d1326;--thbg:#1f2a4a;--hov:#1d2849;--ok:#5cc491;--warn:#e3b04b;--bad:#f08577;--okbg:#18362a;--warnbg:#3a2f13;--badbg:#40201c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bgtop),var(--bg) 320px);background-color:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,Arial,sans-serif;min-height:100vh}
body.auth{background:linear-gradient(135deg,#1d2a78,#27368f 55%,#2f9be0)}
header{background:linear-gradient(120deg,#1a2670 0%,#27368f 55%,#2f9be0 140%);border-bottom:5px solid var(--red);color:#fff}
.wrap{max-width:1760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logobox{background:#fff;border-radius:10px;padding:3px 8px;display:inline-flex;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{height:52px;display:block}
h1{font:700 26px/1 "Barlow Condensed",Arial Narrow,sans-serif;margin:0;letter-spacing:.3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header .note{color:#dbe5ff}
header input[type=file]{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
header .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
header .btn:not(.ghost){background:linear-gradient(135deg,#d62828,#f0603a);color:#fff}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:#cfdaff;font:600 15px Barlow,sans-serif;padding:10px 16px;cursor:pointer;white-space:nowrap;border-radius:10px 10px 0 0}
nav button:hover{color:#fff;background:rgba(255,255,255,.1)}
nav button[aria-selected=true]{background:#fff;color:#27368f}
nav{padding-bottom:6px}
nav button{border-radius:10px}
.khead{padding-bottom:10px}
.kt{color:#dbe5ff;font-size:13px;margin:2px 0 5px}
.kg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.khead .kpi{padding:6px 12px;border-radius:10px}
.khead .kpi b{font-size:22px}
@media(max-width:900px){.kg{grid-template-columns:repeat(3,minmax(0,1fr))}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main{padding:12px 16px 30px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-radius:12px;padding:12px 14px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.kpi span{display:block;font-size:13px;opacity:.92}
.kpi b{font:700 26px/1.2 "Barlow Condensed",sans-serif}
.k1{background:linear-gradient(135deg,#27368f,#4b63d8)}.k2{background:linear-gradient(135deg,#1b7fc4,#2f9be0)}.k3{background:linear-gradient(135deg,#7b3fb8,#a86be0)}.k4{background:linear-gradient(135deg,#c27a00,#f0a92b)}.k5{background:linear-gradient(135deg,#c62828,#ef5b4b)}.k6{background:linear-gradient(135deg,#0f7a4a,#1fae6b)}.k7{background:linear-gradient(135deg,#7a1414,#d62828)}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(39,54,143,.08)}
.two>div>.panel:nth-child(even){border-top-color:var(--red)}
.panel h2{font:700 20px "Barlow Condensed",sans-serif;margin:0 0 12px;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;width:100%}
textarea{min-height:70px}
.btn{font:600 14px Barlow,sans-serif;background:linear-gradient(135deg,var(--brand),var(--sky));color:var(--brand-ink);border:0;border-radius:8px;padding:7px 14px;min-height:34px;cursor:pointer;width:auto}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--line)}
.btn.del{color:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--brand);background:var(--thbg);font-size:13px;padding:6px 5px;border-bottom:2px solid var(--brand);white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td,tr:hover>td{background:var(--hov)}
td input,td select{min-height:30px;padding:3px 6px;font-size:14px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.big{font:700 24px "Barlow Condensed",sans-serif}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.note{color:var(--mute);font-size:14px}
.warn{background:var(--warnbg);color:var(--warn);border-left:4px solid var(--warn);border-radius:6px;padding:6px 10px;margin:8px 0;font-size:14px}
.link{cursor:pointer}
.login{max-width:400px;margin:40px auto;background:var(--card);border-radius:16px;border-top:6px solid var(--red);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login h2{font:700 22px "Barlow Condensed",sans-serif;color:var(--brand);margin:6px 0}
.biglogo{display:block;width:100%;max-width:340px;margin:0 auto 10px;background:#fff;border-radius:10px}
.mt{table-layout:fixed;font-size:12.5px}
.mt th{white-space:normal}
.mt td{overflow-wrap:anywhere;padding:3px 4px}
.mt td input,.mt td select{font-size:12.5px;padding:2px 4px;min-height:26px;margin-bottom:2px}
.mt td .btn{padding:3px 8px;min-height:26px;font-size:12px;width:100%;margin-bottom:3px}
.acrow{margin-bottom:4px}
.grid.sm{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.three>.panel:nth-child(2){border-top-color:var(--red)}
@media(max-width:1000px){.three{grid-template-columns:1fr}.mt{min-width:1000px}}
.tag{display:inline-block;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:18px;width:min(420px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.four>.panel,.three>.panel{margin-bottom:0;height:100%}
.four>.panel:nth-child(even){border-top-color:var(--red)}
.four table{font-size:12.5px}.four textarea{min-height:150px}
.three{align-items:stretch}
@media(max-width:1100px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.four{grid-template-columns:1fr}}
@media(min-width:1100px){.grid.sm{grid-template-columns:repeat(7,minmax(0,1fr))}}
.cfg textarea{min-height:110px}
@media print{header,.noprint,.btn{display:none!important}body{background:#fff!important;color:#000}.panel{border:0;padding:0;box-shadow:none}input,select,textarea{border:0;background:none;color:#000;padding:0}.kpi{color:#000;background:none!important;border:1px solid #999;box-shadow:none}}
#dt{width:min(340px,94vw);padding:12px;background:#fff;color:#000}
.tk{font:13px/1.35 "Courier New",monospace;color:#000;background:#fff;padding:10px;border:1px dashed #999;border-radius:6px}
.tk img{display:block;width:100%;margin:0 auto 6px}
.tk .c{text-align:center}.tk hr{border:0;border-top:1px dashed #000;margin:6px 0}
.tk .row{display:flex;justify-content:space-between;gap:8px}.tk .big{font-size:16px;font-weight:700}.tk .sm{font-size:11px;margin-bottom:2px}
@media print{body.pt header,body.pt main,body.pt #dc{display:none!important}body.pt #dt{position:static;display:block;width:80mm;max-width:100%;border:0;padding:0;margin:0;box-shadow:none;background:#fff}body.pt .tk{border:0}@page{margin:4mm}}
</style>
</head>
